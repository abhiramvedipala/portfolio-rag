services:
  - type: web
    name: portfolio-rag
    runtime: docker
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_TOKEN
        sync: false
      # The apex redirects to www, so the browser sends the www origin -- the
      # apex alone would reject every real request. localhost entries keep the
      # Vite dev server working against this backend.
      - key: CORS_ORIGINS
        value: "https://www.abhiramreddy.dev,https://abhiramreddy.dev,http://localhost:8080,http://127.0.0.1:8080"
